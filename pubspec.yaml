name: wedding_tinder
description: "Tinder for wedding vendor planning — shared swipe-to-shortlist for engaged couples."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  appinio_swiper: ^2.1.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  google_nav_bar: ^5.0.7
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/vendors.json
    - assets/images/vendors/
  fonts:
    - family: PhosphorThin
      fonts:
        - asset: assets/fonts/Phosphor-Thin.ttf
