name: wedding_tinder
description: "Tinder for wedding vendor planning — shared swipe-to-shortlist for engaged couples."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  appinio_swiper: ^2.1.1
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  intl: ^0.19.0
  google_nav_bar: ^5.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/vendors/
